
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141027">
<title>Христиночка ❤️ — голосова помічниця</title>
<style>
* { box-sizing: border-box; }
:root {
  --bg: #141027;
  --panel: #211b3c;
  --text: #fff5fc;
  --muted: #c4b9d5;
  --accent: #ff72b2;
}
body {
  margin: 0;
  min-height: 100dvh;
  font-family: system-ui, Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 20% 10%, #5d285e, transparent 40%),
    radial-gradient(circle at 90% 90%, #292d67, transparent 40%),
    var(--bg);
}
.app {
  max-width: 760px;
  min-height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  padding: 18px;
  gap: 15px;
}
header { text-align: center; }
.heart {
  font-size: 52px;
  animation: beat 2s infinite;
}
@keyframes beat {
  50% { transform: scale(1.12); }
}
h1 {
  font-size: 32px;
  margin: 5px 0;
}
.subtitle { color: var(--muted); }
.status {
  display: inline-block;
  background: #ffffff15;
  padding: 9px 15px;
  border-radius: 30px;
  font-size: 14px;
}
.chat {
  flex: 1;
  min-height: 280px;
  max-height: 55dvh;
  overflow-y: auto;
  padding: 15px;
  background: #ffffff0b;
  border: 1px solid #ffffff20;
  border-radius: 24px;
}
.message {
  max-width: 88%;
  width: fit-content;
  padding: 12px 16px;
  margin: 12px 0;
  border-radius: 19px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.bot {
  background: var(--panel);
  border-bottom-left-radius: 5px;
}
.user {
  background: #a93e7e;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
}
button {
  cursor: pointer;
  border: 0;
  color: white;
  font: inherit;
}
.mic {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  font-size: 36px;
  background: linear-gradient(135deg, #ff83b8, #c43e91);
  box-shadow: 0 8px 35px #ff5da35a;
}
.mic.listening {
  animation: pulse 1s infinite;
}
@keyframes pulse {
  50% { box-shadow: 0 0 0 18px #ff72b222; }
}
.small {
  background: #ffffff20;
  padding: 12px;
  border-radius: 15px;
}
form {
  display: flex;
  gap: 9px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border: 1px solid #ffffff35;
  border-radius: 17px;
  background: #ffffff15;
  color: white;
  font-size: 16px;
  outline: none;
}
input::placeholder { color: #c9bed7; }
.send {
  background: #d44b94;
  padding: 0 19px;
  border-radius: 17px;
}
footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="heart">❤️</div>
    <h1>Христиночка</h1>
    <p class="subtitle">Твоя українська голосова помічниця</p>
    <div id="status" class="status" role="status">
      ✨ Готова до спілкування
    </div>
  </header>

  <section id="chat" class="chat"
           aria-label="Історія розмови"
           aria-live="polite">
    <div class="message bot">
      Привіт! ❤️ Я Христиночка.
      Можеш говорити зі мною або писати повідомлення.
      Натисни на мікрофон, щоб почати!
    </div>
  </section>

  <div class="controls">
    <button id="sound" class="small"
            type="button" aria-label="Вимкнути голос">
      🔊
    </button>
    <button id="mic" class="mic"
            type="button" aria-label="Говорити">
      🎙️
    </button>
    <button id="clear" class="small"
            type="button" aria-label="Очистити чат">
      🗑️
    </button>
  </div>

  <form id="form">
    <input id="input" autocomplete="off"
           placeholder="Напиши щось Христиночці..."
           aria-label="Твоє повідомлення">
    <button class="send" type="submit">➤</button>
  </form>

  <footer>
    З любов'ю ❤️ • Українська мова
  </footer>
</main>

<script>
const chat = document.getElementById("chat");
const statusBox = document.getElementById("status");
const mic = document.getElementById("mic");
const input = document.getElementById("input");
const sound = document.getElementById("sound");

let soundOn = true;
let listening = false;
let recognition = null;

function status(text) {
  statusBox.textContent = text;
}

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "message " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!soundOn || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "uk-UA";
  utterance.rate = 0.95;
  utterance.pitch = 1.08;

  const voices = speechSynthesis.getVoices();
  const ukrainian = voices.find(v =>
    v.lang.toLowerCase().startsWith("uk")
  );
  if (ukrainian) utterance.voice = ukrainian;

  speechSynthesis.speak(utterance);
}

function reply(message) {
  const t = message.toLowerCase();

  if (/привіт|добрий день|вітаю/.test(t))
    return "Привіт, сонечко! ❤️ Дуже рада тебе чути. Як твій настрій?";

  if (/як справи|як ти/.test(t))
    return "Дякую, що запитуєш! Я тут і готова поспілкуватися з тобою.";

  if (/як тебе звати|твоє ім/.test(t))
    return "Мене звати Христиночка. Я твоя голосова помічниця!";

  if (/котра година|скільки часу/.test(t))
    return "Зараз " + new Date().toLocaleTimeString(
      "uk-UA", {hour:"2-digit", minute:"2-digit"}
    );

  if (/яке сьогодні число|яка дата/.test(t))
    return "Сьогодні " + new Date().toLocaleDateString(
      "uk-UA", {day:"numeric", month:"long", year:"numeric"}
    );

  if (/дякую|спасибі/.test(t))
    return "Завжди будь ласка! ❤️";

  if (/сумно|самотньо|погано/.test(t))
    return "Мені шкода, що тобі зараз нелегко. Хочеш розповісти, що сталося? Я уважно слухаю.";

  if (/мотивац|підтрим/.test(t))
    return "Навіть маленький крок сьогодні може змінити твоє завтра. Я вірю, що ти зможеш рухатися вперед!";

  if (/що ти вмієш|допомога/.test(t))
    return "Я можу привітатися, підтримати розмову, сказати час і дату та відповідати голосом. Для вільних розмов із штучним інтелектом мені знадобиться додаткове підключення.";

  return "Я тебе почула. ❤️ Розкажи трохи більше. Поки що я вмію відповідати на прості фрази, але ми поступово розширимо мої можливості.";
}

function processMessage(text) {
  text = text.trim();
  if (!text) return;

  addMessage(text, "user");
  const answer = reply(text);
  addMessage(answer, "bot");
  speak(answer);
  status("✨ Готова до спілкування");
}

document.getElementById("form").addEventListener(
  "submit", event => {
    event.preventDefault();
    const text = input.value;
    input.value = "";
    processMessage(text);
  }
);

sound.addEventListener("click", () => {
  soundOn = !soundOn;
  sound.textContent = soundOn ? "🔊" : "🔇";
  sound.setAttribute(
    "aria-label",
    soundOn ? "Вимкнути голос" : "Увімкнути голос"
  );
  if (!soundOn && "speechSynthesis" in window)
    speechSynthesis.cancel();
});

document.getElementById("clear").addEventListener(
  "click", () => {
    chat.replaceChildren();
    addMessage("Почнімо нову розмову! ❤️", "bot");
    if ("speechSynthesis" in window)
      speechSynthesis.cancel();
  }
);

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "uk-UA";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    listening = true;
    mic.classList.add("listening");
    status("🎙️ Слухаю тебе...");
  };

  recognition.onresult = event => {
    const text = event.results[0][0].transcript;
    processMessage(text);
  };

  recognition.onerror = event => {
    if (event.error === "not-allowed")
      status("Дозволь доступ до мікрофона в браузері");
    else if (event.error === "no-speech")
      status("Не почула голосу. Спробуй ще раз");
    else
      status("Помилка мікрофона: " + event.error);
  };

  recognition.onend = () => {
    listening = false;
    mic.classList.remove("listening");
  };

  mic.addEventListener("click", () => {
    if (listening) {
      recognition.stop();
      return;
    }
    if ("speechSynthesis" in window)
      speechSynthesis.cancel();
    try {
      recognition.start();
    } catch (e) {
      status("Спробуй натиснути мікрофон ще раз");
    }
  });
} else {
  mic.disabled = true;
  mic.style.opacity = "0.5";
  status("Голосове розпізнавання недоступне в цьому браузері");
}
</script>
</body>
</html>
